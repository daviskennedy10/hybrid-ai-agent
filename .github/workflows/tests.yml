name: offline-tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: python3 -m venv .venv
      - run: .venv/bin/python -m pip install --require-hashes -r requirements.lock
      - run: .venv/bin/python scripts/test_offline.py
      - run: .venv/bin/python -m benchmarks.verify
      - run: .venv/bin/python scripts/scan_public.py
