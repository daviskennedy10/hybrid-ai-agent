# Offline container validation only. Never runs a second Telegram poller.
services:
  security-tests:
    image: hybrid-ai-agent:local
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    network_mode: none
    pids_limit: 128
    mem_limit: 1g
    cpus: 1
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
      - /app/router/logs:rw,nosuid,noexec,size=16m,uid=10001,gid=10001,mode=0700
    command: ["python", "-m", "unittest", "discover", "-s", "tests", "-v"]
